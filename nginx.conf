server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    # Revalida siempre (ETag): un pull + build muestra la versión nueva sin vaciar la caché.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.mjs$ {
        types {
            application/javascript mjs;
        }
        try_files $uri =404;
    }
}
